files:
  required:
    - path: "/etc/pam.d/common-auth"
      type: "config"
      parser: "pam"
      description: "Check Debian-family authentication failure accumulation and lockout policy"

    - path: "/etc/pam.d/common-account"
      type: "config"
      parser: "pam"
      description: "Check Debian-family account unlock and reset/account policy"

  optional:
    - path: "/etc/security/faillock.conf"
      type: "config"
      parser: "key_value"
      description: "Check faillock-based deny and unlock_time settings"

    - path: "/etc/pam.d/system-auth"
      type: "config"
      parser: "pam"
      description: "RHEL-family compatibility path"

    - path: "/etc/pam.d/password-auth"
      type: "config"
      parser: "pam"
      description: "RHEL-family compatibility path"

    - path: "/etc/default/login"
      type: "config"
      parser: "key_value"
      description: "Login lockout policy path for some Unix-family systems"

    - path: "/etc/security/policy.conf"
      type: "config"
      parser: "key_value"
      description: "Login lockout policy path for some Unix-family systems"

    - path: "/etc/security/user"
      type: "config"
      parser: "key_value"
      description: "Login lockout policy path for some Unix-family systems"

    - path: "/etc/default/security"
      type: "config"
      parser: "key_value"
      description: "Login lockout policy path for some Unix-family systems"

commands:
  - name: "check_authselect"
    command: "authselect current"
    description: "Check active authselect features"

  - name: "check_faillock_config"
    command: "grep -E 'deny|unlock_time' /etc/security/faillock.conf"
    description: "Check deny and unlock_time values in faillock.conf"

  - name: "check_pam_lockout_modules"
    command: "grep -E 'pam_tally|pam_tally2|pam_faillock' /etc/pam.d/common-auth /etc/pam.d/common-account"
    description: "Check whether Debian-family PAM lockout modules are applied"

evidence:
  - key: "lockout_backend"
    source: "pam/common-auth, pam/common-account, faillock.conf"
    description: "Type of lockout policy module in use"

  - key: "deny"
    source: "/etc/security/faillock.conf or PAM module options"
    description: "Account lockout threshold"

  - key: "unlock_time"
    source: "/etc/security/faillock.conf or PAM module options"
    description: "Unlock duration"

  - key: "pam_tally_module"
    source: "/etc/pam.d/common-auth or /etc/pam.d/common-account"
    description: "Whether pam_tally.so is applied"

  - key: "pam_tally2_module"
    source: "/etc/pam.d/common-auth or /etc/pam.d/common-account"
    description: "Whether pam_tally2.so is applied"

  - key: "pam_faillock_auth_module"
    source: "/etc/pam.d/common-auth"
    description: "Whether pam_faillock.so is applied in the auth chain"

  - key: "pam_faillock_account_module"
    source: "/etc/pam.d/common-account"
    description: "Whether pam_faillock.so is applied in the account chain"

  - key: "reset_option"
    source: "/etc/pam.d/common-account"
    description: "Whether pam_tally/pam_tally2 reset option is present"

  - key: "authselect_profile"
    source: "authselect current"
    description: "Active authselect profile"