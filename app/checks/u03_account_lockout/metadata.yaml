code: "U-03"
name: "Configure Account Lockout Threshold"
severity: "high"
category: "account_management"
requires_root: "required"

summary: >
  This item locks accounts when login failures are repeated
  to neutralize brute-force and dictionary attacks.

description: >
  It checks the account lockout threshold, unlock duration, and whether PAM authentication modules are applied
  to verify whether an automatic defense policy for accumulated login failures is configured.

purpose: >
  Limit login failures so attackers cannot try passwords without limit,
  and block account compromise attempts early.

platform: "debian_family"

references:
  - "/etc/pam.d/system-auth"
  - "/etc/pam.d/password-auth"
  - "/etc/security/faillock.conf"
  - "/etc/pam.d/common-auth"
  - "/etc/pam.d/common-account"
  - "/etc/default/login"
  - "/etc/security/policy.conf"
  - "/etc/security/user"
  - "/etc/default/security"