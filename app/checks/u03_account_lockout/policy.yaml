check_type: "composite"

profile: "default_debian"

decision_order:
  - "tally_rule"
  - "faillock_rule"

rules:
  tally_rule:
    description: >
      When using pam_tally.so or pam_tally2.so
      the module is applied in common-auth and common-account,
      the deny value must be 10 or less, and reset or appropriate post-processing must exist in the account chain.

    auth_targets:
      - "/etc/pam.d/common-auth"
      - "/etc/pam.d/system-auth"
      - "/etc/pam.d/password-auth"

    account_targets:
      - "/etc/pam.d/common-account"

    accepted_modules:
      - "pam_tally.so"
      - "pam_tally2.so"

    required_options:
      deny:
        operator: "<="
        value: 10

    recommended_options:
      unlock_time:
        operator: ">="
        value: 1

    account_requirements:
      requires_reset_option: true

    when_module_missing: "manual"
    when_option_missing: "fail"
    when_file_missing: "manual"

    pass_condition: >
      pam_tally or pam_tally2 is applied in the auth/account chain and
      the deny value is 10 or less and reset processing exists in the account chain

    fail_condition: >
      pam_tally or pam_tally2 based settings exist but
      the deny value is missing, exceeds 10 attempts, or account post-processing is insufficient

  faillock_rule:
    description: >
      When using pam_faillock.so
      the module is applied in common-auth and common-account
      the deny value must be set to 10 or less.

    auth_targets:
      - "/etc/pam.d/common-auth"
      - "/etc/pam.d/system-auth"
      - "/etc/pam.d/password-auth"

    account_targets:
      - "/etc/pam.d/common-account"

    accepted_modules:
      - "pam_faillock.so"

    accepted_option_sources:
      - "pam_module"
      - "faillock_conf"

    required_options:
      deny:
        operator: "<="
        value: 10

    recommended_options:
      unlock_time:
        operator: ">="
        value: 1

    required_auth_occurrences:
      - "preauth"
      - "authfail"

    account_requirements:
      requires_account_module: true

    when_module_missing: "manual"
    when_option_missing: "fail"
    when_file_missing: "manual"

    pass_condition: >
      pam_faillock is applied in the auth/account chain and
      deny is 10 or less and unlock_time or an equivalent unlock policy is configured

    fail_condition: >
      pam_faillock-based settings exist but
      auth/account chain application is incomplete, deny is missing, or deny exceeds 10 attempts

final_decision:
  pass:
    - "Account lockout threshold is set to 10 attempts or fewer"
    - "One of pam_tally, pam_tally2, or pam_faillock is properly applied"

  fail:
    - "Account lockout threshold is missing or exceeds 10 attempts"
    - "Lockout module is not applied"
    - "auth/account chain configuration is incomplete"

  manual:
    - "Configuration file is missing or a non-standard path is used"
    - "Additional verification is required due to distribution or PAM configuration differences"

evidence_required:
  - "deny"
  - "unlock_time"
  - "Whether pam_tally/pam_tally2/pam_faillock is applied"
  - "Active authselect features"

thresholds:
  max_deny: 10
  unlock_time_required: true
  authselect_collection_recommended: true