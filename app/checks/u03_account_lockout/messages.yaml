title: "U-03 Configure Account Lockout Threshold"

pass:
  summary: "The account lockout threshold is properly configured."
  detail: >
    An account lockout policy based on accumulated login failures is applied,
    providing a baseline defense against brute-force and dictionary attacks.

fail:
  summary: "The account lockout threshold is missing or does not meet the criteria."
  detail: >
    Because accounts are not locked after accumulated login failures, attackers can try passwords without limit.

manual:
  summary: "Automatic determination is difficult."
  detail: >
    Due to missing configuration files, non-standard PAM configuration, or distribution-specific differences,
    additional verification is required.

remediation:
  summary: "Set the account lockout threshold to 10 attempts or fewer, and correctly configure unlock handling and PAM order."
  actions:
    - "Use one of pam_tally.so, pam_tally2.so, or pam_faillock.so to apply a login failure accumulation policy."
    - "Set the deny value to 10 or less."
    - "Set unlock_time to specify the unlock duration."
    - "When using pam_tally or pam_tally2, configure the reset option or equivalent post-processing in the account chain."
    - "When using pam_faillock, verify that it is properly applied in both the auth and account chains."
    - "If the distribution uses authselect, check the current active profile and features together."
    - "PAM file changes can affect login itself, so apply them after taking a backup."

evidence_labels:
  lockout_backend: "Account lockout policy implementation method"
  deny: "Account lockout threshold"
  unlock_time: "Unlock duration"
  pam_tally_module: "Whether pam_tally.so is applied"
  pam_tally2_module: "Whether pam_tally2.so is applied"
  pam_faillock_auth_module: "Whether pam_faillock.so is applied in the auth chain"
  pam_faillock_account_module: "Whether pam_faillock.so is applied in the account chain"
  reset_option: "Whether the reset option is applied"
  authselect_profile: "Active authselect profile"

notes:
  - "For Debian-family systems, check /etc/pam.d/common-auth and /etc/pam.d/common-account first."
  - "For RHEL-family compatibility, treat system-auth and password-auth as optional."
  - "In some environments, deny and unlock_time may be defined in faillock.conf instead of PAM module options."
  - "Incorrect PAM module order or interface configuration may cause login failures."