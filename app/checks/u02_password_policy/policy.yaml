check_type: "composite"

profile: "default_debian"

decision_order:
  - "complexity_rule"
  - "history_rule"
  - "aging_rule"
  - "pam_rule"

rules:
  complexity_rule:
    target_file: "/etc/security/pwquality.conf"
    parser: "key_value"

    required_keys:
      minlen:
        operator: ">="
        value: 8
      dcredit:
        operator: "<="
        value: -1
      ucredit:
        operator: "<="
        value: -1
      lcredit:
        operator: "<="
        value: -1
      ocredit:
        operator: "<="
        value: -1

    optional_flags:
      - "enforce_for_root"

    when_file_missing: "manual"
    when_key_missing: "fail"

    pass_condition: >
      Minimum length of 8 or more in pwquality.conf and
      digit/uppercase/lowercase/special-character composition requirements are configured

    fail_condition: >
      Password complexity policy is missing in pwquality.conf or
      the criterion value is not met

  history_rule:
    preferred_target_file: "/etc/security/pwhistory.conf"
    fallback_target_file: "/etc/pam.d/common-password"

    checks:
      remember:
        operator: ">="
        value: 4

    when_file_missing: "manual"
    when_key_missing: "fail"

    pass_condition: >
      A policy preventing reuse of at least the last 4 passwords is configured

    fail_condition: >
      Recent password reuse prevention policy is missing or below criterion

  aging_rule:
    target_file: "/etc/login.defs"
    parser: "key_value"

    required_keys:
      PASS_MIN_DAYS:
        operator: ">="
        value: 1
      PASS_MAX_DAYS:
        operator: "<="
        value: 90

    when_file_missing: "manual"
    when_key_missing: "fail"

    pass_condition: >
      Minimum age is at least 1 day and maximum age is 90 days or less

    fail_condition: >
      Password change cycle policy is missing or does not meet the criterion

  pam_rule:
    target_file: "/etc/pam.d/common-password"
    parser: "pam"

    required_modules:
      - "pam_pwquality.so"
      - "pam_unix.so"

    optional_modules:
      - "pam_pwhistory.so"

    order_constraints:
      - before: "pam_pwquality.so"
        after: "pam_unix.so"
      - before: "pam_pwhistory.so"
        after: "pam_unix.so"

    when_file_missing: "manual"
    when_module_missing: "fail"

    pass_condition: >
      pam_pwquality.so is applied in common-password and
      pam_pwhistory.so is placed before pam_unix.so when required

    fail_condition: >
      pwquality or pwhistory-related PAM policy is missing in common-password or
      the application order is incorrect

final_decision:
  pass:
    - "Password management policy is configured"
    - "Complexity, change cycle, and reuse prevention policies meet the criteria"

  fail:
    - "Password management policy is missing or does not meet the criteria"

  manual:
    - "Configuration file is missing or a non-standard path is used"
    - "Additional verification is required due to distribution/version-specific PAM structure differences"

evidence_required:
  - "minimum length"
  - "letter/digit/special-character requirements"
  - "change cycle"
  - "reuse prevention count"

thresholds:
  min_length: 8
  min_days: 1
  max_days: 90
  remember_count: 4
  require_digit: true
  require_uppercase: true
  require_lowercase: true
  require_special: true
  enforce_for_root_recommended: true