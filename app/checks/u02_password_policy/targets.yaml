files:
  required:
    - path: "/etc/login.defs"
      type: "config"
      parser: "key_value"
      description: "Check minimum/maximum password age"

    - path: "/etc/security/pwquality.conf"
      type: "config"
      parser: "key_value"
      description: "Check password complexity policy"

    - path: "/etc/pam.d/common-password"
      type: "config"
      parser: "pam"
      description: "Check whether Debian-family PAM password policy is applied"

  optional:
    - path: "/etc/security/pwhistory.conf"
      type: "config"
      parser: "key_value"
      description: "Check the number of recent passwords that cannot be reused"

    - path: "/etc/pam.d/system-auth"
      type: "config"
      parser: "pam"
      description: "RHEL-family compatibility path"

    - path: "/etc/default/passwd"
      type: "config"
      parser: "key_value"
      description: "Password policy path for some Unix-family systems"

    - path: "/etc/default/security"
      type: "config"
      parser: "key_value"
      description: "Password policy path for some Unix-family systems"

commands:
  - name: "check_password_age"
    command: "grep -E 'PASS_MAX_DAYS|PASS_MIN_DAYS' /etc/login.defs"
    description: "Check minimum/maximum password age"

  - name: "check_pwquality"
    command: "grep -E 'minlen|dcredit|ucredit|lcredit|ocredit|enforce_for_root' /etc/security/pwquality.conf"
    description: "Check password complexity policy"

  - name: "check_pwhistory"
    command: "grep remember /etc/security/pwhistory.conf"
    description: "Check password reuse prevention settings"

evidence:
  - key: "minlen"
    source: "/etc/security/pwquality.conf"
    description: "Minimum password length"

  - key: "dcredit"
    source: "/etc/security/pwquality.conf"
    description: "Digit inclusion policy"

  - key: "ucredit"
    source: "/etc/security/pwquality.conf"
    description: "Uppercase inclusion policy"

  - key: "lcredit"
    source: "/etc/security/pwquality.conf"
    description: "Lowercase inclusion policy"

  - key: "ocredit"
    source: "/etc/security/pwquality.conf"
    description: "Special character inclusion policy"

  - key: "enforce_for_root"
    source: "/etc/security/pwquality.conf"
    description: "Whether the policy also applies to the root account"

  - key: "remember"
    source: "/etc/security/pwhistory.conf"
    description: "Number of recent passwords that cannot be reused"

  - key: "pass_min_days"
    source: "/etc/login.defs"
    description: "Minimum password age"

  - key: "pass_max_days"
    source: "/etc/login.defs"
    description: "Maximum password age"

  - key: "pam_pwquality_module"
    source: "/etc/pam.d/common-password"
    description: "Whether pam_pwquality.so is applied"

  - key: "pam_pwhistory_module"
    source: "/etc/pam.d/common-password"
    description: "Whether pam_pwhistory.so is applied"

  - key: "pam_unix_module"
    source: "/etc/pam.d/common-password"
    description: "Whether pam_unix.so is applied"

  - key: "pam_module_order"
    source: "/etc/pam.d/common-password"
    description: "Application order of pam_pwquality.so, pam_pwhistory.so, and pam_unix.so"