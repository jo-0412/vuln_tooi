code: "U-02"
name: "Configure Password Management Policy"
severity: "high"
category: "account_management"
requires_root: "partial"

summary: >
  This item enforces password complexity and change cycles
  to improve account security.

description: >
  Password minimum length, character composition, change cycle,
  and reuse prevention policies must be properly configured.

purpose: >
  Prevent short and simple passwords,
  and restrict reuse of identical or similar passwords
  to reduce the risk of account compromise.

platform: "debian_family"

references:
  - "/etc/login.defs"
  - "/etc/security/pwquality.conf"
  - "/etc/security/pwhistory.conf"
  - "/etc/pam.d/system-auth"
  - "/etc/pam.d/common-password"
  - "/etc/default/passwd"
  - "/etc/default/security"