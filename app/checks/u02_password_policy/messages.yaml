title: "U-02 Configure Password Management Policy"

pass:
  summary: "The password management policy is properly configured."
  detail: >
    Minimum length, character composition, password change cycle,
    and recent password reuse prevention policy are configured according to the criteria, so the configuration is compliant.

fail:
  summary: "The password management policy is missing or weakly configured."
  detail: >
    Because the password policy is weak or missing, short and simple passwords can be used,
    and reuse of identical or similar passwords increases the risk of account compromise.

manual:
  summary: "Automatic determination is difficult."
  detail: >
    Due to missing configuration files, non-standard PAM configuration, or distribution-specific differences,
    additional verification is required.

remediation:
  summary: "Strengthen password complexity, change cycle, and reuse prevention policies."
  actions:
    - "Set the minimum length to 8 or more in /etc/security/pwquality.conf."
    - "Configure a policy requiring a combination of digits, uppercase letters, lowercase letters, and special characters."
    - "If possible, add enforce_for_root so the same policy also applies to the root account."
    - "Set PASS_MIN_DAYS 1 and PASS_MAX_DAYS 90 in /etc/login.defs."
    - "In /etc/security/pwhistory.conf or PAM settings, prohibit reuse of at least the last 4 passwords."
    - "In /etc/pam.d/common-password, order pam_pwquality.so and pam_pwhistory.so before pam_unix.so."

evidence_labels:
  minlen: "Minimum password length"
  dcredit: "Digit inclusion policy"
  ucredit: "Uppercase inclusion policy"
  lcredit: "Lowercase inclusion policy"
  ocredit: "Special character inclusion policy"
  enforce_for_root: "Whether the policy also applies to the root account"
  remember: "Number of recent passwords that cannot be reused"
  pass_min_days: "Minimum password age"
  pass_max_days: "Maximum password age"
  pam_pwquality_module: "Whether pam_pwquality.so is applied"
  pam_pwhistory_module: "Whether pam_pwhistory.so is applied"
  pam_unix_module: "Whether pam_unix.so is applied"
  pam_module_order: "PAM module order"

notes:
  - "For Debian-family systems, check /etc/pam.d/common-password first."
  - "For RHEL-family compatibility, treat /etc/pam.d/system-auth as optional."
  - "In some environments, pwhistory settings may be placed directly in PAM line options, so fallback handling is required."