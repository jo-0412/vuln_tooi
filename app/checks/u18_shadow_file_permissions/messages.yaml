title: "U-18 Configure /etc/shadow Owner and Permissions"

pass:
  summary: "The owner and permissions of /etc/shadow are appropriate."
  detail: >
    The password hash file is protected so that only administrators can control it,
    so the risk of unauthorized access and tampering is low.

fail:
  summary: "The owner or permission settings of /etc/shadow are insufficient."
  detail: >
    The password hash file has excessive permissions or an inappropriate owner,
    so unauthorized users may collect hashes and attempt cracking attacks.

manual:
  summary: "Automatic determination is difficult."
  detail: >
    A non-standard Linux path or platform-specific alternative storage structure was detected,
    additional verification is required.

error:
  summary: "An error occurred while running the check."
  detail: >
    An error occurred while checking required files or collecting metadata.

remediation:
  summary: "The /etc/shadow file must be owned by root and restricted to permission 0400 or more restrictive."
  actions:
    - "Set the owner of /etc/shadow to root."
    - "Restrict /etc/shadow permissions to 0400."
    - "If needed, change the owner using chown root /etc/shadow."
    - "If needed, change permissions using chmod 400 /etc/shadow."
    - "For AIX-family systems, check /etc/security/passwd."
    - "For HP-UX-family systems, check the protection status of /tcb/files/auth."
    - "Back up related files before making changes."

evidence_labels:
  shadow_exists: "/etc/shadow existence status"
  shadow_owner_uid: "/etc/shadow owner UID"
  shadow_group_gid: "/etc/shadow group GID"
  shadow_mode: "/etc/shadow permission value"
  aix_passwd_exists: "AIX password storage file existence status"
  trusted_mode_path_exists: "HP-UX Trusted Mode path existence status"

notes:
  - "For Linux/Solaris-family systems, check /etc/shadow first."
  - "For AIX-family systems, check /etc/security/passwd."
  - "For HP-UX-family systems, check /tcb/files/auth and Trusted Mode usage."
  - "The permission criterion uses 0400 or more restrictive as the default."