code: "U-18"
name: "Configure /etc/shadow Owner and Permissions"
severity: "high"
category: "account_management"
requires_root: "required"

summary: >
  This item checks whether the owner and permissions of password hash storage files are appropriate
  to prevent unauthorized access and tampering.

description: >
  It checks /etc/shadow on Linux/Solaris-family systems and
  alternative storage paths on AIX and HP-UX-family systems
  to verify that password hash storage files are protected so only administrators can control them.

purpose: >
  Ensure that only administrators can control password hash storage files
  to prevent unauthorized users from accessing or tampering with the files.

platform: "unix_like"

references:
  - "/etc/shadow"
  - "/etc/security/passwd"
  - "/tcb/files/auth"