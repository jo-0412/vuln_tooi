check_type: "composite"

profile: "default_unix"

rules:
  shadow_permission_rule:
    description: >
      On Linux/Solaris-family systems, /etc/shadow is owned by root and
      permissions are checked to ensure they are 400 or more restrictive.

    required_files:
      - "/etc/shadow"

    shadow_requirements:
      owner_uid:
        operator: "=="
        value: 0

      max_mode_octal:
        value: "0400"

    when_required_file_missing: "manual"

    pass_condition: >
      /etc/shadow exists and
      owner UID is 0 (root) and
      permissions are 0400 or more restrictive

    fail_condition: >
      /etc/shadow owner is not root or
      permissions are not 0400 or more restrictive

  alt_platform_rule:
    description: >
      On AIX or HP-UX-family systems, refer to whether alternative storage paths exist
      and classify the item for additional manual verification.

    optional_files:
      - "/etc/security/passwd"
      - "/tcb/files/auth"

    allow_alt_password_store: true

    manual_condition: >
      This is not a standard Linux path and
      an AIX or HP-UX-family storage structure is detected

final_decision:
  pass:
    - "/etc/shadow is owned by root and permissions are 0400 or more restrictive"

  fail:
    - "/etc/shadow owner is not root"
    - "/etc/shadow permissions are not 0400 or more restrictive"

  manual:
    - "This appears to be an AIX or HP-UX alternative storage structure and requires additional verification"
    - "/etc/shadow is missing, but an alternative storage path exists"

  error:
    - "Failed to verify required file metadata"

evidence_required:
  - "/etc/shadow existence status"
  - "/etc/shadow owner UID"
  - "/etc/shadow permission value"
  - "AIX/HP-UX alternative storage path result"

thresholds:
  required_owner_uid: 0
  max_shadow_mode: "0400"