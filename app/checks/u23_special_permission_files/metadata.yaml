code: "U-23"
name: "Check Files with SUID, SGID, and Sticky Bit Settings"
severity: "high"
category: "file_and_directory_management"
requires_root: "required"

summary: >
  This item checks files with SUID, SGID, and sticky-bit settings across the full filesystem
  to identify privilege escalation risks from unnecessary special-permission files.

description: >
  It scans the full filesystem and collects files and directories with SUID, SGID, and sticky-bit settings,
  and checks whether special permissions are granted outside allowed items.

purpose: >
  Remove unnecessary special-permission files to reduce ordinary user privilege escalation,
  misuse, and bypass execution risks.

platform: "unix_like"

references:
  - "Special-permission files in the full filesystem"