scan:
  roots:
    - "/"

  exclude_paths:
    - "/proc"
    - "/sys"
    - "/dev"
    - "/run"
    - "/snap"
    - "/var/lib/docker"
    - "/var/lib/containerd"

commands:
  - name: "find_suid_sgid_root_owned_files"
    command: "find / -user root -type f \\( -perm -04000 -o -perm -02000 \\) -xdev -exec ls -al {} \\;"
    description: "Check the list of root-owned SUID/SGID executables"

  - name: "find_sticky_directories"
    command: "find / -type d -perm -01000 -xdev -exec ls -ald {} \\;"
    description: "Check the list of sticky-bit directories"

evidence:
  - key: "suid_files"
    source: "filesystem"
    description: "List of SUID files"

  - key: "sgid_files"
    source: "filesystem"
    description: "List of SGID files"

  - key: "sticky_dirs"
    source: "filesystem"
    description: "List of sticky-bit directories"

  - key: "unexpected_suid_files"
    source: "filesystem"
    description: "SUID files outside the allowlist"

  - key: "unexpected_sgid_files"
    source: "filesystem"
    description: "SGID files outside the allowlist"

  - key: "unexpected_sticky_dirs"
    source: "filesystem"
    description: "Sticky-bit directories outside the allowlist"

  - key: "special_permission_count"
    source: "filesystem"
    description: "Number of special-permission items"

  - key: "review_required_items"
    source: "filesystem"
    description: "List of items requiring business-need review"