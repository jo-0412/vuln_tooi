check_type: "composite"

profile: "default_linux"

rules:
  special_permission_rule:
    description: >
      Collect SUID, SGID, and sticky-bit files and directories from the full filesystem,
      and check whether items outside the allowlist exist.

    scan_requirements:
      scan_root_required: true
      require_root_owned_suid_sgid_check: true

    allowlists:
      suid_files:
        - "/usr/bin/passwd"
        - "/usr/bin/su"
        - "/usr/bin/chfn"
        - "/usr/bin/chsh"
        - "/usr/bin/gpasswd"
        - "/usr/bin/newgrp"
        - "/usr/bin/sudo"
        - "/bin/su"
        - "/bin/ping"
        - "/bin/ping6"
        - "/usr/bin/pkexec"

      sgid_files:
        - "/usr/bin/wall"
        - "/usr/bin/expiry"
        - "/usr/bin/ssh-agent"
        - "/usr/bin/mlocate"

      sticky_dirs:
        - "/tmp"
        - "/var/tmp"
        - "/dev/shm"

    comparison_rules:
      unexpected_suid_files_fail: true
      unexpected_sgid_files_fail: true
      unexpected_sticky_dirs_manual: true

    pass_condition: >
      No SUID/SGID files outside the allowlist exist and
      sticky-bit directories are also within the policy allowlist

    fail_condition: >
      SUID or SGID files outside the allowlist exist

    manual_condition: >
      Sticky-bit directories exist in non-standard locations or
      special-permission items requiring business-need review exist

final_decision:
  pass:
    - "No SUID/SGID files outside the allowlist exist"

  fail:
    - "SUID files outside the allowlist exist"
    - "SGID files outside the allowlist exist"

  manual:
    - "Non-standard sticky-bit directories exist"
    - "Items requiring business-need review exist"

  error:
    - "Filesystem scan itself could not be performed"

evidence_required:
  - "List of special-permission files"
  - "File path"
  - "Owner"
  - "Permissions"
  - "Business-need review result"

thresholds:
  require_allowlist_review: true