title: "U-23 Check Files with SUID, SGID, and Sticky Bit Settings"

pass:
  summary: "No unnecessary SUID/SGID special-permission files exist."
  detail: >
    No unauthorized special-permission files were found,
    so the risk of privilege escalation by ordinary users is low.

fail:
  summary: "Unnecessary SUID/SGID special-permission files exist."
  detail: >
    Unnecessary SUID/SGID files exist, so ordinary users may use those files
    to attempt root privilege escalation.

manual:
  summary: "Special-permission items requiring additional review exist."
  detail: >
    For some files or directories with special permissions,
    business need and operational purpose require additional verification.

error:
  summary: "An error occurred while running the check."
  detail: >
    An error occurred while scanning the full filesystem or collecting special-permission items.

remediation:
  summary: "Remove unnecessary special permissions and grant only the minimum required permissions when needed."
  actions:
    - "Review the business need for SUID/SGID files outside the allowlist."
    - "Remove unnecessary special permissions with chmod -s."
    - "Delete unnecessary files or check package status."
    - "If needed, redesign group and execute permissions so only a specific group can use them."
    - "For sticky-bit directories, review the need for items outside standard paths such as /tmp and /var/tmp."
    - "Before remediation, verify file ownership, package relationships, and service impact."

evidence_labels:
  suid_files: "List of SUID files"
  sgid_files: "List of SGID files"
  sticky_dirs: "List of sticky-bit directories"
  unexpected_suid_files: "SUID files outside the allowlist"
  unexpected_sgid_files: "SGID files outside the allowlist"
  unexpected_sticky_dirs: "Sticky-bit directories outside the allowlist"
  special_permission_count: "Number of special-permission items"
  review_required_items: "Items requiring business-need review"

notes:
  - "Do not assume all SUID/SGID files are vulnerable; review business need and whether they are part of the system default configuration."
  - "Sticky bit is mainly used for shared directories such as /tmp and /var/tmp."
  - "The allowlist may vary by distribution and installed packages."