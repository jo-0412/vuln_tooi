check_type: "composite"

profile: "default_linux_phase1"

rules:
  logging_config_rule:
    description: >
      rsyslog or syslog configuration file exists and
      check whether active configuration lines exist.

    optional_files:
      - "/etc/rsyslog.conf"
      - "/etc/rsyslog.d/default.conf"
      - "/etc/syslog.conf"

    policy_presence_patterns:
      - "*.info"
      - "*.notice"
      - "*.warn"
      - "*.err"
      - "auth"
      - "authpriv"
      - "mail"
      - "daemon"
      - "/var/log/"

    pass_condition: >
      rsyslog or syslog configuration file exists and
      active logging configuration traces are found

  logging_service_rule:
    description: >
      Check whether one of rsyslog or syslog services is active.

    accepted_commands:
      - "rsyslog_service_status"
      - "syslog_service_status"

    pass_condition: >
      One of rsyslog or syslog services is active

  log_file_rule:
    description: >
      Check whether major log files actually exist.

    optional_files:
      - "/var/log/syslog"
      - "/var/log/messages"
      - "/var/log/auth.log"
      - "/var/log/secure"

    pass_condition: >
      At least one major log file exists

final_decision:
  pass:
    - "At least two of logging configuration traces, service status, and actual log files were found"

  fail:
    - "No logging configuration traces exist, services are inactive or unverified, and log files are missing"

  manual:
    - "Some traces exist, but determining policy compliance is difficult"
    - "Logging policy documents require separate verification as operational evidence"

  error:
    - "Failed to collect configuration files or service status"

decision_logic:
  phase1_rule: >
    In the initial implementation, if at least two of the following three are found, it is considered a PASS candidate.
    1) Logging configuration files and active configuration traces
    2) Logging service active status
    3) Major log files exist

    If all three are insufficient, it is considered FAIL,
    and if only some are found, it is considered MANUAL.

thresholds:
  minimum_positive_signals_for_pass: 2