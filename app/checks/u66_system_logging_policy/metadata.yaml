code: "U-66"
name: "Configure System Logging According to Policy"
severity: "high"
category: "logging_and_audit"
requires_root: "partial"

summary: >
  This item checks organizational system logging policy and whether logs are actually generated
  to verify incident analysis, evidence collection, and audit response capability.

description: >
  It checks syslog/rsyslog configuration files, logging service status, and whether major log files exist
  to verify whether system logging according to policy is actually operating.

purpose: >
  Maintain the system log recording structure so that causes can be analyzed, incidents verified, and legal/audit responses supported
  when security incidents occur.

platform: "unix_like"

references:
  - "/etc/syslog.conf"
  - "/etc/rsyslog.conf"
  - "/etc/rsyslog.d/default.conf"