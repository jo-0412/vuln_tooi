title: "U-66 Configure System Logging According to Policy"

pass:
  summary: "System logging configuration traces according to policy were found."
  detail: >
    Some logging settings, service status, or major log files were found,
    indicating that the system logging structure is operating at least to a certain level.

fail:
  summary: "System logging configuration is insufficient or policy traces are lacking."
  detail: >
    Because system logging is not configured or does not comply with policy,
    identifying causes and securing evidence during incidents is difficult.

manual:
  summary: "System logging policy compliance requires additional verification."
  detail: >
    Some logging traces exist, but additional review is required to verify whether settings match organizational policy and
    whether actual operating policy documents exist.

error:
  summary: "An error occurred while running the check."
  detail: >
    An error occurred while collecting logging configuration files, service status, or log files.

remediation:
  summary: "Establish an organizational log policy and maintain syslog/rsyslog configuration and service application status according to that policy."
  actions:
    - "Document the organizational log policy and establish operational criteria."
    - "Reflect required logging policies in /etc/rsyslog.conf or /etc/syslog.conf."
    - "Verify that major security events are actually recorded in log files."
    - "After configuration changes, restart or reload rsyslog or syslog and verify that they are applied."
    - "Periodically check log file creation and retention status."

evidence_labels:
  rsyslog_conf_exists: "Whether the rsyslog configuration file exists"
  syslog_conf_exists: "Whether the syslog configuration file exists"
  logging_policy_lines: "Active logging configuration lines"
  rsyslog_service_active: "Whether the rsyslog service is active"
  syslog_service_active: "Whether the syslog service is active"
  major_log_files: "Whether major log files exist"
  major_log_file_count: "Number of existing major log files"
  logging_policy_document_note: "Whether logging policy documents require verification"

notes:
  - "The initial implementation focuses on checking whether a logging structure exists rather than the policy document itself."
  - "Organizational logging policy documents and audit criteria may be outside automatic collection scope."
  - "syslog, rsyslog, and journald usage may vary by distribution."