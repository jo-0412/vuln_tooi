files:
  optional:
    - path: "/etc/rsyslog.conf"
      type: "config"
      parser: "plain_text"
      description: "Default rsyslog configuration file"

    - path: "/etc/rsyslog.d/default.conf"
      type: "config"
      parser: "plain_text"
      description: "Additional rsyslog configuration file"

    - path: "/etc/syslog.conf"
      type: "config"
      parser: "plain_text"
      description: "Default syslog configuration file"

    - path: "/var/log/syslog"
      type: "log"
      parser: "plain_text"
      description: "System log file"

    - path: "/var/log/messages"
      type: "log"
      parser: "plain_text"
      description: "Message log file"

    - path: "/var/log/auth.log"
      type: "log"
      parser: "plain_text"
      description: "Authentication log file"

    - path: "/var/log/secure"
      type: "log"
      parser: "plain_text"
      description: "Security log file"

commands:
  - name: "grep_rsyslog_conf"
    command: "grep -v '^#' /etc/rsyslog.conf"
    description: "Check rsyslog settings excluding comments"

  - name: "grep_syslog_conf"
    command: "grep -v '^#' /etc/syslog.conf"
    description: "Check syslog settings excluding comments"

  - name: "rsyslog_service_status"
    command: "systemctl is-active rsyslog"
    description: "Check rsyslog service active status"

  - name: "syslog_service_status"
    command: "systemctl is-active syslog"
    description: "Check syslog service active status"

evidence:
  - key: "rsyslog_conf_exists"
    source: "/etc/rsyslog.conf"
    description: "Whether the rsyslog configuration file exists"

  - key: "syslog_conf_exists"
    source: "/etc/syslog.conf"
    description: "Whether the syslog configuration file exists"

  - key: "logging_policy_lines"
    source: "rsyslog/syslog"
    description: "Active logging configuration lines"

  - key: "rsyslog_service_active"
    source: "systemctl is-active rsyslog"
    description: "Whether the rsyslog service is active"

  - key: "syslog_service_active"
    source: "systemctl is-active syslog"
    description: "Whether the syslog service is active"

  - key: "major_log_files"
    source: "/var/log/*"
    description: "Whether major log files exist"

  - key: "major_log_file_count"
    source: "/var/log/*"
    description: "Number of existing major log files"

  - key: "logging_policy_document_note"
    source: "manual"
    description: "Whether logging policy documents require verification"