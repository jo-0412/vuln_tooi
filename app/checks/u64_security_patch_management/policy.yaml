check_type: "composite"

profile: "default_linux_phase1"

rules:
  patch_configuration_rule:
    description: >
      Check whether automatic update settings or patch policy traces exist.

    optional_files:
      - "/etc/apt/apt.conf.d/20auto-upgrades"
      - "/etc/apt/apt.conf.d/50unattended-upgrades"

    configuration_patterns:
      auto_upgrade:
        - "APT::Periodic::Update-Package-Lists"
        - "APT::Periodic::Unattended-Upgrade"

      unattended_upgrade:
        - "Unattended-Upgrade"
        - "Allowed-Origins"
        - "Origins-Pattern"

    pass_condition: >
      Automatic update configuration file exists and
      related configuration traces are found

  patch_history_rule:
    description: >
      Check whether recent patch history or automatic update logs exist.

    optional_files:
      - "/var/log/apt/history.log"
      - "/var/log/unattended-upgrades/unattended-upgrades.log"

    pass_condition: >
      Recent package upgrade history or automatic update logs exist

  package_status_rule:
    description: >
      Check current upgradeable packages and whether patch tools are installed.

    accepted_commands:
      - "apt_upgradable"
      - "dpkg_unattended"
      - "hostnamectl"
      - "uname_kernel"

    pass_condition: >
      unattended-upgrades installation traces or patch-manageable status are found

final_decision:
  pass:
    - "Patch configuration traces exist and recent management history was found"

  fail:
    - "No patch policy traces or recent patch management history were found"

  manual:
    - "Some traces exist, but determining actual periodic management status is difficult"

  error:
    - "Failed to collect files or commands"

decision_logic:
  phase1_rule: >
    In the initial implementation, if at least two of the following three are found, it is considered a PASS candidate.
    1) Automatic update/patch configuration traces
    2) Recent patch history or logs
    3) Patch management tool/patch status verification traces

    If all three are insufficient, it is considered FAIL,
    and if only some are found, it is considered MANUAL.

evidence_required:
  - "OS/kernel version"
  - "Current patch level verification traces"
  - "List of upgradeable packages"
  - "Periodic patch management traces"

thresholds:
  minimum_positive_signals_for_pass: 2