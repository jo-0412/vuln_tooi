title: "U-64 Apply Periodic Security Patches and Vendor Advisories"

pass:
  summary: "Periodic security patch management traces were found."
  detail: >
    Some automatic update settings, recent patch history, or patch management tool traces were found,
    indicating that security patches are managed at least to a certain level.

fail:
  summary: "Periodic security patch management traces are insufficient."
  detail: >
    Because the latest security patches are not applied, the likelihood of an incident exploiting already disclosed vulnerabilities is high.

manual:
  summary: "Patch management status requires additional verification."
  detail: >
    Some settings or logs exist,
    but additional review is required to verify whether they are actually managed according to a periodic security patch policy.

error:
  summary: "An error occurred while running the check."
  detail: >
    An error occurred while collecting patch configuration files or package status.

remediation:
  summary: "Review vendor advisories and the latest patch level, and apply patches according to the periodic patch policy."
  actions:
    - "Review service impact, then verify the latest security patch level."
    - "Check automatic update or unattended security update settings."
    - "Maintain patch management documents such as periodic inspection reports, review reports, and work plans."
    - "Periodically check that upgradeable packages are not left unattended for a long time."
    - "Review vendor advisories and security notices, and apply required patches."

evidence_labels:
  auto_upgrade_config_exists: "Whether the automatic update configuration file exists"
  unattended_upgrade_config_exists: "Whether the unattended security update configuration file exists"
  auto_upgrade_enabled: "Whether automatic package refresh/update is enabled"
  unattended_installed: "Whether unattended-upgrades is installed"
  recent_patch_history_present: "Whether recent patch history exists"
  unattended_log_present: "Whether automatic update logs exist"
  upgradable_packages: "List of upgradeable packages"
  upgradable_package_count: "Number of upgradeable packages"
  os_version_info: "OS and kernel version information"
  kernel_version: "Current kernel version"

notes:
  - "The initial implementation focuses on checking whether a patch management structure exists rather than exact comparison with the latest versions."
  - "Policy documents and work plans may be outside automatic collection scope and can be reviewed with operational evidence."
  - "Detailed implementation may vary by distribution and package manager."