code: "U-64"
name: "Apply Periodic Security Patches and Vendor Advisories"
severity: "high"
category: "patch_management"
requires_root: "required"

summary: >
  This item checks whether latest security patch application processes and vendor advisories are reflected
  to maintain system stability and security.

description: >
  It checks patch policy documents, automatic update settings, recent patch history,
  and current upgradeable package status
  to verify whether periodic security patch management is performed.

purpose: >
  Apply the latest security patches and reflect vendor advisories
  to reduce exposure to already disclosed vulnerabilities.

platform: "unix_like"

references:
  - "Patch policy document"
  - "Periodic inspection report"
  - "Work plan"
  - "Package/kernel version information"