files:
  optional:
    - path: "/etc/apt/apt.conf.d/20auto-upgrades"
      type: "config"
      parser: "plain_text"
      description: "Automatic update configuration file"

    - path: "/etc/apt/apt.conf.d/50unattended-upgrades"
      type: "config"
      parser: "plain_text"
      description: "Unattended security update configuration file"

    - path: "/var/log/apt/history.log"
      type: "log"
      parser: "plain_text"
      description: "APT package installation and upgrade history"

    - path: "/var/log/unattended-upgrades/unattended-upgrades.log"
      type: "log"
      parser: "plain_text"
      description: "Automatic security update log"

commands:
  - name: "hostnamectl"
    command: "hostnamectl"
    description: "Check OS and kernel version information"

  - name: "uname_kernel"
    command: "uname -r"
    description: "Check current kernel version"

  - name: "apt_upgradable"
    command: "apt list --upgradable"
    description: "Check list of upgradeable packages"

  - name: "dpkg_unattended"
    command: "dpkg -l unattended-upgrades"
    description: "Check whether unattended-upgrades is installed"

  - name: "apt_policy"
    command: "apt-cache policy"
    description: "Check APT repository and priority information"

  - name: "grep_auto_upgrade"
    command: "grep -R \"Unattended-Upgrade\\|Update-Package-Lists\" /etc/apt/apt.conf.d/"
    description: "Check automatic update configuration traces"

evidence:
  - key: "auto_upgrade_config_exists"
    source: "/etc/apt/apt.conf.d/20auto-upgrades"
    description: "Whether the automatic update configuration file exists"

  - key: "unattended_upgrade_config_exists"
    source: "/etc/apt/apt.conf.d/50unattended-upgrades"
    description: "Whether the unattended security update configuration file exists"

  - key: "auto_upgrade_enabled"
    source: "/etc/apt/apt.conf.d/20auto-upgrades"
    description: "Whether automatic package list refresh/update is enabled"

  - key: "unattended_installed"
    source: "dpkg -l unattended-upgrades"
    description: "Whether unattended-upgrades is installed"

  - key: "recent_patch_history_present"
    source: "/var/log/apt/history.log"
    description: "Whether recent patch history exists"

  - key: "unattended_log_present"
    source: "/var/log/unattended-upgrades/unattended-upgrades.log"
    description: "Whether automatic update logs exist"

  - key: "upgradable_packages"
    source: "apt list --upgradable"
    description: "List of upgradeable packages"

  - key: "upgradable_package_count"
    source: "apt list --upgradable"
    description: "Number of upgradeable packages"

  - key: "os_version_info"
    source: "hostnamectl"
    description: "OS and kernel version information"

  - key: "kernel_version"
    source: "uname -r"
    description: "Current kernel version"