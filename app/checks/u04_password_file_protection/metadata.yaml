code: "U-04"
name: "Protect Password Files"
severity: "high"
category: "account_management"
requires_root: "required"

summary: >
  This item checks shadow password usage and protected storage locations
  to ensure passwords are not stored in plaintext or weak formats.

description: >
  It checks /etc/passwd, /etc/shadow, and password storage locations for some Unix-family systems
  to verify whether passwords are separated or securely protected.

purpose: >
  Prevent account passwords from being exposed in plaintext or weak formats,
  and reduce the risk of direct password information exposure if system files are leaked.

platform: "unix_like"

references:
  - "/etc/passwd"
  - "/etc/shadow"
  - "/etc/security/passwd"
  - "/tcb/files/auth"