check_type: "composite"

profile: "default_unix"

decision_order:
  - "shadow_rule"
  - "alt_platform_rule"

rules:
  shadow_rule:
    description: >
      On Linux/general Unix-family systems, the second field of /etc/passwd is x and
      if /etc/shadow exists, shadow passwords are considered in use.

    required_files:
      - "/etc/passwd"

    optional_files:
      - "/etc/shadow"

    passwd_requirements:
      root_second_field:
        operator: "=="
        value: "x"

      disallow_plain_password_in_passwd: true

      allow_special_tokens:
        - "x"
        - "*"
        - "!"
        - "!!"
        - "NP"
        - "LK"

    shadow_requirements:
      shadow_exists_required: true

    when_required_file_missing: "error"
    when_optional_file_missing: "fail"

    pass_condition: >
      The second field for root in /etc/passwd is x and
      there are no direct password values in the passwd file and
      /etc/shadow exists

    fail_condition: >
      Password information is stored directly in /etc/passwd or
      /etc/shadow does not exist

  alt_platform_rule:
    description: >
      On AIX or HP-UX-family systems, separate password storage locations may exist, so
      refer to whether /etc/security/passwd or /tcb/files/auth exists.

    optional_files:
      - "/etc/security/passwd"
      - "/tcb/files/auth"

    allow_alt_password_store: true

    pass_condition: >
      /etc/security/passwd or /tcb/files/auth and similar paths
      platform-specific protected storage exists

    manual_condition: >
      Manual verification is required when this is not a standard Linux path and platform-specific storage is suspected

final_decision:
  pass:
    - "Shadow passwords are in use"
    - "Passwords are not stored directly in /etc/passwd"
    - "or platform-specific protected storage is used"

  fail:
    - "Passwords are stored directly in /etc/passwd"
    - "/etc/shadow is missing and shadow separation is not used"
    - "Passwords are not securely protected"

  manual:
    - "This appears to be a platform-specific password storage structure and requires additional verification"

  error:
    - "The required file (/etc/passwd) itself could not be read"

evidence_required:
  - "Second passwd field for root"
  - "/etc/shadow existence status"
  - "AIX/HP-UX alternative storage location check result"

thresholds:
  root_field_must_be_x: true
  shadow_exists_required: true