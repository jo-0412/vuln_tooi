files:
  required:
    - path: "/etc/passwd"
      type: "config"
      parser: "passwd"
      description: "Basic account information file"

  optional:
    - path: "/etc/shadow"
      type: "config"
      parser: "shadow"
      description: "Shadow password file"

    - path: "/etc/security/passwd"
      type: "config"
      parser: "aix_passwd"
      description: "AIX-family password storage location"

    - path: "/tcb/files/auth"
      type: "directory"
      parser: "trusted_mode"
      description: "HP-UX Trusted Mode password storage location"

commands:
  - name: "read_passwd"
    command: "cat /etc/passwd"
    description: "Check full /etc/passwd content"

  - name: "grep_root_passwd"
    command: "grep '^root:' /etc/passwd"
    description: "Check the second passwd field for the root account"

  - name: "shadow_ls"
    command: "ls -l /etc/shadow"
    description: "Check /etc/shadow existence and protection status"

  - name: "pwconv_help"
    command: "pwconv"
    description: "Check whether the shadow password application tool exists"

evidence:
  - key: "passwd_exists"
    source: "/etc/passwd"
    description: "/etc/passwd existence status"

  - key: "passwd_root_second_field"
    source: "/etc/passwd"
    description: "Second passwd field value for the root account"

  - key: "passwd_accounts_using_x"
    source: "/etc/passwd"
    description: "Whether shadow separation (x) is used in the passwd file"

  - key: "passwd_plain_password_detected"
    source: "/etc/passwd"
    description: "Whether password hashes or plaintext passwords exist directly in the passwd file"

  - key: "shadow_exists"
    source: "/etc/shadow"
    description: "/etc/shadow existence status"

  - key: "shadow_readable"
    source: "/etc/shadow"
    description: "Whether /etc/shadow is readable"

  - key: "aix_passwd_exists"
    source: "/etc/security/passwd"
    description: "Whether the AIX-family password storage file exists"

  - key: "trusted_mode_path_exists"
    source: "/tcb/files/auth"
    description: "HP-UX Trusted Mode path existence status"

  - key: "pwconv_available"
    source: "pwconv"
    description: "Whether the pwconv command is available"