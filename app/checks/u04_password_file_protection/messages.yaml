title: "U-04 Protect Password Files"

pass:
  summary: "Password files are properly protected."
  detail: >
    Passwords are protected through shadow separation or a secure storage method,
    so the risk of direct password exposure is low if account information files are leaked.

fail:
  summary: "Password file protection is insufficient."
  detail: >
    Account passwords are not protected by shadow separation or secure encryption,
    so password exposure risk is high if files are leaked.

manual:
  summary: "Automatic determination is difficult."
  detail: >
    The system does not use the standard Linux storage structure or uses a platform-specific password storage method,
    additional verification is required.

error:
  summary: "An error occurred while running the check."
  detail: >
    A required file could not be read, or an error occurred while collecting information needed for the check.

remediation:
  summary: "Verify shadow password usage and ensure passwords are not stored directly in the passwd file."
  actions:
    - "Verify that the second field in /etc/passwd is set to x."
    - "Verify that /etc/shadow exists."
    - "If shadow passwords are not used, apply shadow passwords using pwconv or an equivalent tool."
    - "If password hashes or plaintext passwords are stored directly in /etc/passwd, remove them immediately and switch to a shadow structure."
    - "For HP-UX-family systems, consider switching to Trusted Mode if needed."
    - "For AIX-family systems, check the /etc/security/passwd storage structure."
    - "Before applying changes, back up related account files and perform the work with root privileges."

evidence_labels:
  passwd_exists: "/etc/passwd existence status"
  passwd_root_second_field: "Second passwd field for the root account"
  passwd_accounts_using_x: "Whether shadow separation is used in the passwd file"
  passwd_plain_password_detected: "Whether passwords are stored directly in the passwd file"
  shadow_exists: "/etc/shadow existence status"
  shadow_readable: "Whether /etc/shadow is readable"
  aix_passwd_exists: "AIX password storage file existence status"
  trusted_mode_path_exists: "HP-UX Trusted Mode path existence status"
  pwconv_available: "Whether the pwconv command is available"

notes:
  - "For Linux-family systems, check the /etc/passwd and /etc/shadow combination first."
  - "For AIX-family systems, check /etc/security/passwd."
  - "For HP-UX-family systems, check /tcb/files/auth and Trusted Mode usage."
  - "If the second field of the passwd file is not x, shadow passwords are likely not in use."