title: "U-28 Restrict Access by IP and Port"

pass:
  summary: "An access IP or port restriction policy was found."
  detail: >
    Policy traces restricting access to allowed hosts or ports were found,
    so external service exposure is controlled.

fail:
  summary: "No access IP or port restriction policy was found."
  detail: >
    Services are exposed broadly without allowed IP restrictions,
    so unauthorized access may occur through vulnerable services such as SSH, FTP, or Telnet.

manual:
  summary: "The access restriction policy requires additional verification."
  detail: >
    Related settings or firewall traces exist,
    but additional review is required to verify whether allowed IP and port restrictions are sufficient.

error:
  summary: "An error occurred while running the check."
  detail: >
    An error occurred while collecting access control files or firewall policies.

remediation:
  summary: "Configure access control so only allowed IPs and ports are open and all others are blocked."
  actions:
    - "When using TCP Wrapper(hosts.allow, hosts.deny), specify only allowed services and allowed hosts."
    - "Using a firewall suited to the operating environment among iptables, firewalld, or UFW, open only allowed ports and allowed IPs."
    - "Restrict SSH service access to specific management networks or management IPs whenever possible."
    - "Block ports unnecessarily exposed to external networks."
    - "Before changes, review current firewall policies and network service impact."

evidence_labels:
  hosts_allow_exists: "Whether hosts.allow exists"
  hosts_deny_exists: "Whether hosts.deny exists"
  hosts_allow_rules: "List of allowed host rules"
  hosts_deny_rules: "List of denied host rules"
  iptables_policy_present: "Whether iptables policy exists"
  firewalld_policy_present: "Whether firewalld policy exists"
  ufw_policy_present: "Whether UFW policy exists"
  ssh_port: "SSH service port settings"
  ssh_listen_address: "SSH ListenAddress settings"
  listening_ports: "List of currently open ports"

notes:
  - "The initial implementation focuses on checking policy existence and restriction traces."
  - "Determining whether actual allowed IP ranges are appropriate can be refined in a later implementation."
  - "iptables, nftables, firewalld, and UFW usage may vary by distribution."