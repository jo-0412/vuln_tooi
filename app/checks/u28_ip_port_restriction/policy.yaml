check_type: "composite"

profile: "default_linux_phase1"

rules:
  tcp_wrapper_rule:
    description: >
      Through hosts.allow and hosts.deny files,
      check whether allow/deny target IP or host restriction policies exist.

    optional_files:
      - "/etc/hosts.allow"
      - "/etc/hosts.deny"

    accepted_patterns:
      deny_all:
        - "ALL: ALL"
        - "ALL:ALL"

      allow_restricted_examples:
        - "sshd:"
        - "in.ftpd:"
        - "vsftpd:"
        - "telnetd:"

    pass_condition: >
      In hosts.allow or hosts.deny,
      allow/deny rules for specific services exist

    manual_condition: >
      Files exist, but determining whether practical restrictions exist is difficult

  firewall_rule:
    description: >
      In at least one of iptables, firewalld, or ufw,
      check whether policy traces based on allowed ports or allowed IPs exist.

    accepted_commands:
      - "iptables_list"
      - "firewalld_list"
      - "ufw_status"

    policy_presence_patterns:
      iptables:
        - "Chain INPUT"
        - "DROP"
        - "REJECT"
        - "ACCEPT"

      firewalld:
        - "services:"
        - "ports:"
        - "sources:"
        - "rich rules:"

      ufw:
        - "Status: active"
        - "ALLOW"
        - "DENY"
        - "LIMIT"

    pass_condition: >
      In at least one of iptables, firewalld, or ufw,
      access control policy traces are found

  ssh_restriction_rule:
    description: >
      Check whether port or ListenAddress restrictions are configured for the SSH service criterion.

    optional_files:
      - "/etc/ssh/sshd_config"

    ssh_requirements:
      port_present_allowed: true
      listen_address_restriction_recommended: true

    pass_condition: >
      In sshd_config, Port or ListenAddress and similar settings
      configuration traces restricting exposure scope exist

final_decision:
  pass:
    - "Allowed IP or allowed port restriction policy traces were found"

  fail:
    - "Allowed IP/port restriction policy traces were not found"

  manual:
    - "Policy files or firewall rules exist, but determining practical restriction status is difficult"

  error:
    - "Failed to collect files or command results"

decision_logic:
  phase1_rule: >
    In the initial implementation, among TCP Wrapper, firewall, and SSH restriction traces,
    if at least one is found, it is considered a PASS candidate.
    If no traces are found, it is considered FAIL.

evidence_required:
  - "allow/deny file content"
  - "Firewall rule list"
  - "Allowed IP and allowed port list"

thresholds:
  require_any_control_evidence: true