code: "U-28"
name: "Restrict Access by IP and Port"
severity: "high"
category: "network_security"
requires_root: "required"

summary: >
  This item checks whether service access is restricted to allowed hosts and ports
  to reduce the external attack surface.

description: >
  It checks whether TCP Wrapper, OS firewall, and service settings
  open only allowed IPs and ports.

purpose: >
  Allow only permitted hosts to access services
  to minimize external exposure of network services such as SSH, FTP, and Telnet.

platform: "unix_like"

references:
  - "/etc/hosts.allow"
  - "/etc/hosts.deny"
  - "/etc/firewall/pf.conf"
  - "/etc/ipf/ipf.conf"
  - "/var/adm/inetd.sec"