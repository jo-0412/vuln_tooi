files:
  optional:
    - path: "/etc/hosts.allow"
      type: "config"
      parser: "plain_text"
      description: "TCP Wrapper allow policy file"

    - path: "/etc/hosts.deny"
      type: "config"
      parser: "plain_text"
      description: "TCP Wrapper deny policy file"

    - path: "/etc/firewall/pf.conf"
      type: "config"
      parser: "plain_text"
      description: "PF firewall policy file"

    - path: "/etc/ipf/ipf.conf"
      type: "config"
      parser: "plain_text"
      description: "IPFilter policy file"

    - path: "/var/adm/inetd.sec"
      type: "config"
      parser: "plain_text"
      description: "inetd-based access restriction file"

    - path: "/etc/ssh/sshd_config"
      type: "config"
      parser: "sshd_config"
      description: "SSH service configuration file"

commands:
  - name: "iptables_list"
    command: "iptables -L"
    description: "Check iptables rule list"

  - name: "firewalld_list"
    command: "firewall-cmd --list-all"
    description: "Check full firewalld policy"

  - name: "ufw_status"
    command: "ufw status numbered"
    description: "Check UFW policy"

  - name: "read_hosts_allow"
    command: "cat /etc/hosts.allow"
    description: "Check hosts.allow file content"

  - name: "read_hosts_deny"
    command: "cat /etc/hosts.deny"
    description: "Check hosts.deny file content"

  - name: "listening_ports"
    command: "ss -lntup"
    description: "Check current listening port list"

evidence:
  - key: "hosts_allow_exists"
    source: "/etc/hosts.allow"
    description: "Whether hosts.allow exists"

  - key: "hosts_deny_exists"
    source: "/etc/hosts.deny"
    description: "Whether hosts.deny exists"

  - key: "hosts_allow_rules"
    source: "/etc/hosts.allow"
    description: "List of allowed host rules"

  - key: "hosts_deny_rules"
    source: "/etc/hosts.deny"
    description: "List of denied host rules"

  - key: "iptables_policy_present"
    source: "iptables -L"
    description: "Whether iptables policy exists"

  - key: "firewalld_policy_present"
    source: "firewall-cmd --list-all"
    description: "Whether firewalld policy exists"

  - key: "ufw_policy_present"
    source: "ufw status numbered"
    description: "Whether UFW policy exists"

  - key: "ssh_port"
    source: "/etc/ssh/sshd_config"
    description: "SSH service port settings"

  - key: "ssh_listen_address"
    source: "/etc/ssh/sshd_config"
    description: "SSH ListenAddress settings"

  - key: "listening_ports"
    source: "ss -lntup"
    description: "List of currently open ports"