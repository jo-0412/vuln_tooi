#무엇을 양호/취약으로 볼지 적는 파일
check_type: "composite"

decision_order:
  - "ssh_rule"
  - "telnet_rule"

rules:
  ssh_rule:
    enabled_if:
      service_active_any:
        - "ssh"
        - "sshd"

    target_file: "/etc/ssh/sshd_config"
    key: "PermitRootLogin"

    acceptable_values:
      - "no"

    vulnerable_values:
      - "yes"
      - "prohibit-password"
      - "without-password"
      - "forced-commands-only"

    when_key_missing: "manual"
    when_file_missing: "manual"

    pass_condition: >
      SSH is in use and PermitRootLogin is set to no

    fail_condition: >
      SSH is in use and PermitRootLogin is not set to no

  telnet_rule:
    enabled_if:
      service_active_any:
        - "telnet"
        - "telnet.socket"
        - "inetd"
        - "xinetd"

    checks:
      - file: "/etc/pam.d/login"
        must_contain: "pam_securetty"

      - file: "/etc/securetty"
        must_not_contain_regex: "^pts/[0-9]+"

    when_file_missing: "manual"

    pass_condition: >
      When Telnet-family services are used, pam_securetty is applied and
      there are no pts/* allowed entries in /etc/securetty

    fail_condition: >
      When Telnet-family services are used, pam_securetty is missing or
      pts/* allowed entries exist in /etc/securetty

final_decision:
  pass:
    - "Remote terminal services are not used"
    - "Direct root login is blocked when SSH is used"
    - "Direct root login is blocked when Telnet is used"

  fail:
    - "Direct root login is allowed while remote terminal services are used"

  manual:
    - "Configuration file is missing or the value is unclear"
    - "Distribution/version-specific defaults require verification"

evidence_required:
  - "PermitRootLogin configuration value"
  - "Whether pam_securetty is applied"
  - "Whether pts/* exists in /etc/securetty"