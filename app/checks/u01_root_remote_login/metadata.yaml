#이 항목이 무엇인지 설명하는 파일
code: "U-01"
name: "Restrict Remote root Login"
severity: "high"
category: "account_management"
requires_root: "partial"

summary: >
  This item prevents unauthorized external users from directly logging in remotely as root
  and taking control of the system at the source.

description: >
  Remote terminal services are not used,
  when used, direct root login must be blocked.

purpose: >
  Restrict direct remote login for the root account
  to reduce risks from password guessing, brute-force attacks, and administrator account exposure,
  including the risk of highest-privilege compromise.

platform: "debian_family"

references:
  - "/etc/ssh/sshd_config"
  - "/etc/pam.d/login"
  - "/etc/securetty"
  - "/etc/default/login"
  - "/etc/security/user"
  - "/opt/ssh/etc/sshd_config"