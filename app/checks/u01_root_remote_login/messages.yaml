#사용자에게 보여줄 문장
title: "U-01 Restrict Remote root Login"

pass:
  summary: "Direct remote login for the root account is blocked."
  detail: >
    Remote terminal services are not used,
    or direct root login is restricted in the services in use, so the configuration is compliant.

fail:
  summary: "Direct remote login for the root account is allowed."
  detail: >
    This server allows direct remote login for the root account,
    so if password guessing or brute-force attacks succeed,
    the attacker can immediately obtain highest privileges.

manual:
  summary: "Automatic determination is difficult."
  detail: >
    Due to missing configuration files, non-standard installation paths, or version-specific default differences,
    additional verification is required.

remediation:
  summary: "Set SSH to PermitRootLogin no and block direct root login for Telnet-family services."
  actions:
    - "When using SSH, set PermitRootLogin no in /etc/ssh/sshd_config."
    - "After changing the setting, restart or reload SSH and verify that it is applied."
    - "When using Telnet-family services, verify that pam_securetty is applied in /etc/pam.d/login."
    - "Remove pts/* entries from /etc/securetty to block remote root login."
    - "If operationally required, log in as a normal user and use administrative privileges through sudo or su."

evidence_labels:
  permit_root_login: "PermitRootLogin value in sshd_config"
  pam_securetty: "Whether pam_securetty is applied in /etc/pam.d/login"
  securetty_pts_entries: "Whether pts is allowed in /etc/securetty"