#무엇을 읽을지 적는 파일
files:
  required:
    - path: "/etc/ssh/sshd_config"
      type: "config"
      parser: "sshd_config"
      description: "Check whether direct SSH root login is allowed"

  optional:
    - path: "/etc/pam.d/login"
      type: "config"
      parser: "pam"
      description: "Check whether pam_securetty is applied"

    - path: "/etc/securetty"
      type: "config"
      parser: "line_list"
      description: "Check the list of terminals that allow root login"

    - path: "/etc/default/login"
      type: "config"
      parser: "key_value"
      description: "Check remote root login settings for some Unix-family systems"

    - path: "/etc/security/user"
      type: "config"
      parser: "key_value"
      description: "Check root remote login settings for some Unix-family systems"

    - path: "/opt/ssh/etc/sshd_config"
      type: "config"
      parser: "sshd_config"
      description: "Check non-standard SSH installation paths"

commands:
  - name: "check_ssh_root_login"
    command: "grep -i '^PermitRootLogin' /etc/ssh/sshd_config"
    description: "Check the PermitRootLogin value in SSH configuration"

  - name: "check_pam_securetty"
    command: "grep pam_securetty /etc/pam.d/login"
    description: "Check whether pam_securetty is applied"

  - name: "check_securetty_pts"
    command: "grep '^pts' /etc/securetty"
    description: "Check whether pts entries exist in /etc/securetty"

services:
  - name: "ssh"
    aliases: ["sshd"]
    description: "Check whether the SSH service is used"

  - name: "telnet"
    aliases: ["telnet.socket", "inetd", "xinetd"]
    description: "Check whether Telnet-family services are used"

evidence:
  - key: "permit_root_login"
    source: "/etc/ssh/sshd_config"
    description: "PermitRootLogin configuration value"

  - key: "pam_securetty"
    source: "/etc/pam.d/login"
    description: "Whether pam_securetty is applied"

  - key: "securetty_pts_entries"
    source: "/etc/securetty"
    description: "Whether pts/* is allowed"