files:
  required:
    - path: "/etc/passwd"
      type: "config"
      parser: "passwd"
      description: "Check whether accounts with UID 0 exist"

commands:
  - name: "uid_zero_accounts"
    command: "awk -F: '$3==0 {print}' /etc/passwd"
    description: "Check the list of accounts with UID 0"

  - name: "read_passwd"
    command: "cat /etc/passwd"
    description: "Check full /etc/passwd content"

evidence:
  - key: "passwd_exists"
    source: "/etc/passwd"
    description: "/etc/passwd existence status"

  - key: "uid_zero_accounts"
    source: "/etc/passwd"
    description: "List of accounts with UID 0"

  - key: "uid_zero_non_root_accounts"
    source: "/etc/passwd"
    description: "List of UID 0 accounts other than root"

  - key: "root_passwd_line"
    source: "/etc/passwd"
    description: "Line related to the root account"

  - key: "uid_zero_count"
    source: "/etc/passwd"
    description: "Number of accounts with UID 0"