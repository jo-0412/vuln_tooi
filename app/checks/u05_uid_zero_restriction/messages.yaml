title: "U-05 Prohibit UID 0 Accounts Other Than root"

pass:
  summary: "No UID 0 account exists other than root."
  detail: >
    Only root has UID 0,
    so the possibility of privilege impersonation through hidden administrator accounts is low.

fail:
  summary: "A UID 0 account exists other than root."
  detail: >
    A UID 0 account exists other than root and can be abused as a hidden administrator account,
    making audit tracking difficult.

manual:
  summary: "Automatic determination is difficult."
  detail: >
    The passwd structure is abnormal or the root account is difficult to identify,
    additional verification is required.

error:
  summary: "An error occurred while running the check."
  detail: >
    A required file could not be read, or an error occurred while collecting information needed for the check.

remediation:
  summary: "Remove UID 0 accounts other than root or change them to normal UIDs."
  actions:
    - "Review the list of accounts with UID 0."
    - "Delete unnecessary accounts."
    - "If the account is required for business operations, use usermod -u to change it to a non-zero, non-duplicate UID."
    - "Before changing it, review service impact and file ownership impact for the account."
    - "Before remediation, back up /etc/passwd and related account information."

evidence_labels:
  passwd_exists: "/etc/passwd existence status"
  uid_zero_accounts: "List of accounts with UID 0"
  uid_zero_non_root_accounts: "List of UID 0 accounts other than root"
  root_passwd_line: "Line related to the root account"
  uid_zero_count: "Number of accounts with UID 0"

notes:
  - "UID 0 means the same highest privileges as root regardless of account name."
  - "Even if the account name is not root, UID 0 grants administrator privileges."
  - "Duplicate UID 0 accounts make identification and accountability tracking difficult for audits."