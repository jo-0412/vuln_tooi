code: "U-05"
name: "Prohibit UID 0 Accounts Other Than root"
severity: "high"
category: "account_management"
requires_root: "partial"

summary: >
  This item checks whether accounts with the same UID (0) as root exist
  to detect hidden administrator accounts.

description: >
  It collects the list of accounts with UID 0 from /etc/passwd,
  and checks whether accounts other than root use the same UID.

purpose: >
  Identify hidden administrator accounts with the same UID (0) as root
  to reduce risks such as privilege abuse, account impersonation, and audit tracking difficulty.

platform: "unix_like"

references:
  - "/etc/passwd"