check_type: "composite"

profile: "default_unix"

rules:
  uid_zero_rule:
    description: >
      Extract accounts with UID 0 from /etc/passwd
      and determine whether UID 0 accounts other than root exist.

    required_files:
      - "/etc/passwd"

    passwd_requirements:
      root_account_required: true
      allow_only_root_uid_zero: true

    when_required_file_missing: "error"

    pass_condition: >
      Only root has UID 0

    fail_condition: >
      A UID 0 account other than root exists

    manual_condition: >
      The root account was not found or the passwd structure is abnormal

final_decision:
  pass:
    - "Only root has UID 0"

  fail:
    - "A UID 0 account other than root exists"

  manual:
    - "The passwd structure is abnormal or the root account was not verified"

  error:
    - "The required file (/etc/passwd) could not be read"

evidence_required:
  - "List of accounts with UID 0"
  - "List of UID 0 accounts other than root"
  - "Full related lines in /etc/passwd"

thresholds:
  uid_zero_accounts_allowed:
    - "root"